name: subcheck
description: "SubCheck - A Subscription Tracking and Review Mobile Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Lets screens listen for changes (the dashboard refreshes right after any change).
  provider: ^6.1.2
  # The on-phone storage behind the "Local Database" box in the HLD.
  shared_preferences: ^2.2.3
  # Date and peso formatting.
  intl: ^0.19.0
  # Picking a logo from the photo gallery.
  image_picker: ^1.1.2
  # Finding the app's own folder, so a picked logo can be copied there.
  path_provider: ^2.1.3
  # Local reminders (they work without internet).
  flutter_local_notifications: ^19.5.0
  # "any" = use whatever version flutter_local_notifications needs.
  timezone: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
